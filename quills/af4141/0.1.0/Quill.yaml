quill:
  name: af4141
  version: 0.1.0
  backend: typst
  description: "AF Form 4141 — Individual's Record of Duties and Experience, Ground Environment Personnel"

typst:
  plate_file: plate.typ

main:
  body:
    enabled: false
  fields:
    name:
      type: string
      default: ""
      description: Your name as Last, First, Middle Initial.

    unit:
      type: string
      default: ""
      description: Your unit of assignment.

    grade:
      type: string
      default: ""
      description: Your current grade or CCC level.

    commanders_auth:
      type: string
      default: ""
      description: The commander's authentication on page 1.

card_kinds:
  experience:
    title: Record of Experience
    description: One row of the Record of Experience. The form holds up to 37 rows across two pages.
    ui:
      groups: [record]
    body:
      enabled: false
    fields:
      date:
        type: date
        default: ""
        ui:
          group: record
        description: The date of the action.

      action:
        type: string
        default: ""
        ui:
          group: record
        description: The action taken. Use one row per type of action.

      written_grade:
        type: string
        default: ""
        ui:
          group: record
          compact: true
        description: The written grade, if any, for example 3.

      written_grade_date:
        type: date
        default: ""
        ui:
          group: record
          compact: true
        description: The date of the written grade.

      positional_grade:
        type: string
        default: ""
        ui:
          group: record
          compact: true
        description: The positional grade, if any, for example 2.

      positional_grade_date:
        type: date
        default: ""
        ui:
          group: record
          compact: true
        description: The date of the positional grade.

      auth_or_remarks:
        type: string
        default: ""
        ui:
          group: record
        description: Authenticating initials, for example J.A.D., or remarks.
