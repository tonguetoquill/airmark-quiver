quill:
  name: afmc_moa
  version: 0.0.1
  backend: typst
  description: DoD Memorandum of Agreement (DoDI 4000.19)

typst:
  plate_file: plate.typ

main:
  description: "Add a card for each section of the agreement. Sections print in DoDI 4000.19 order, whatever order you add them in."
  ui:
    groups: [parties, correspondence, terms, financial_details, signatures]
  body:
    enabled: false
  fields:
    first_party_name:
      type: plaintext
      inline: true
      ui:
        group: parties
      description: "Full name and acronym of the organization proposing the agreement."

    second_party_name:
      type: plaintext
      inline: true
      ui:
        group: parties
      description: "Full name and acronym of the other organization."

    second_party_is_non_government:
      type: boolean
      default: false
      ui:
        group: parties
        compact: true
      description: "Whether the second party is outside the government. If so, its mailing address appears in the opening paragraph."

    subject:
      type: plaintext
      inline: true
      ui:
        group: parties
      description: "What the agreement covers. It follows 'FOR' in the title."

    agreement_number:
      type: plaintext
      inline: true
      ui:
        group: parties
      description: The agreement's identification number.

    second_party_mailing_address:
      type: array
      items:
        type: plaintext
      default: []
      ui:
        group: correspondence
      description: "The second party's mailing address for correspondence."

    reimbursable:
      type: boolean
      default: false
      ui:
        group: terms
        compact: true
      description: "Whether the parties reimburse each other. If so, fill in Financial Details, which prints as Attachment A."

    reimbursable_support:
      type: richtext
      inline: true
      default: ""
      ui:
        group: financial_details
      description: "The support being reimbursed."

    estimated_amount:
      type: plaintext
      inline: true
      default: ""
      ui:
        group: financial_details
        compact: true
      description: "Estimated amount to be reimbursed, for example $50,000."

    appropriation_fy:
      type: plaintext
      inline: true
      default: ""
      ui:
        group: financial_details
        compact: true
      description: "Fiscal year of the appropriation, for example 2027."

    cost_center_provider:
      type: plaintext
      inline: true
      default: ""
      ui:
        group: financial_details
        compact: true
      description: "The provider's cost center number, if required."

    cost_center_receiver:
      type: plaintext
      inline: true
      default: ""
      ui:
        group: financial_details
        compact: true
      description: "The receiver's cost center number, if required."

    financial_poc_provider:
      type: plaintext
      inline: true
      default: ""
      ui:
        group: financial_details
      description: "The provider's financial point of contact."

    financial_poc_receiver:
      type: plaintext
      inline: true
      default: ""
      ui:
        group: financial_details
      description: "The receiver's financial point of contact."

    financial_additional_info:
      type: richtext
      inline: true
      default: ""
      ui:
        group: financial_details
      description: "Any other financial terms the agreement needs."

    first_party_signatory:
      type: plaintext
      inline: true
      ui:
        group: signatures
      description: "Name and title of the first party's approving official."

    second_party_signatory:
      type: plaintext
      inline: true
      ui:
        group: signatures
      description: "Name and title of the second party's approving official."

    mid_point_review_due_date:
      type: date
      ui:
        group: signatures
        compact: true
      description: "When the mid-point review of the agreement is due."

card_kinds:
  background:
    title: Background
    description: "Why the agreement is needed, when its purpose doesn't make that clear. Usually left out between DoD organizations. Start with 'BACKGROUND:'."
    seed:
      $body: |
        BACKGROUND: [If there is a need to discuss background, do so here. Normally, there is no need to discuss the background or provide justification for the MOA, particularly if between OSD or DoD Components. Occasionally, however, there is a desire to explain the need for the MOA; particularly where it is not self-evident from the purpose or it is with another federal agency.]

  authorities:
    title: Authorities
    description: "The legal basis for the agreement, such as the Economy Act, and each party's authorities. Start with 'AUTHORITIES:'."
    seed:
      $body: |
        AUTHORITIES: [State the legal authority upon which the reimbursable MOA is based, such as the Economy Act, or any other legal or significant authority that authorizes any such actions associated with this MOA. Discuss the authorities of the Parties here. If the other Party is another federal agency and insists on stating what it believes to be its own authority, preface that assertion with "The [Party] asserts the following authority:" The DoD has no obligation to agree with such assertions of authority by other federal agencies.]

  purpose_and_scope:
    title: Purpose and Scope
    description: "What the agreement does and what it covers. Every MOA has one. Start with 'PURPOSE AND SCOPE:'."
    seed:
      $body: |
        PURPOSE AND SCOPE: [State the purpose and the scope of the MOA here. Always use this paragraph.]

  responsibilities_of_the_parties:
    title: Responsibilities of the Parties
    description: "What each party will do. Start with 'RESPONSIBILITIES OF THE PARTIES:', then add a bullet for each party, such as 'The [First Party] will—', with its obligations nested under it."
    seed:
      $body: |
        RESPONSIBILITIES OF THE PARTIES:

        - The [First Party] will—
          - [insert as many responsibilities as necessary but ensure all the specific requirements of the Party are listed]
        - The [Second Party] will—
          - [insert as many responsibilities as necessary but ensure all the specific obligations of the Party are listed]
        - Both Parties will—
          - [insert as many responsibilities as necessary but ensure that they apply to both Parties]

  personnel:
    title: Personnel
    description: "How each party pays for and supervises its own people, including pay, support, and travel. Start with 'PERSONNEL:'."
    seed:
      $body: |
        PERSONNEL: [Explain each Party's responsibility for all costs of its personnel, including pay and benefits, support, and travel, if applicable to the agreement. Each Party is responsible for supervision and management of its personnel. For shared supervision or management, explain the process to accomplish that.]

  general_provisions:
    title: General Provisions
    description: "The standard terms: points of contact, review, termination, expiration, and the rest of DoDI 4000.19's provisions. Start with 'GENERAL PROVISIONS:'. Include the cancellation provision only when this MOA replaces an earlier one."
    seed:
      $body: |
        GENERAL PROVISIONS:

        - POINTS OF CONTACT (POCS). The following POCs will be used by the Parties to communicate matters concerning this MOA. Each Party may change its POC upon reasonable notice to the other Party.
          - For the [First Party]—
            - Name, position, office identification, phone number and email of primary POC:
            - Position, office identification, phone number and email of alternate POC:
          - For the [Second Party]—
            - Position, office identification, phone number and email of primary POC:
            - Position, office identification, phone number and email of alternate POC:
        - CORRESPONDENCE. All correspondence to be sent and notices to be given pursuant to this MOA will be addressed, if to the [First Party], to [insert mailing address], and, if to the [Second Party], to [insert mailing address], or as may from time to time otherwise be directed by the Parties.
        - REVIEW OF AGREEMENT. If non-reimbursable, this MOA will be reviewed no less often than mid-point on or around the anniversary of its effective date in its entirety. If reimbursable, this MOA will be reviewed on or around the anniversary of its effective date annually for financial impacts; if there are substantial changes in resource requirements, the agreement will be reviewed in its entirety.
        - MODIFICATION OF AGREEMENT. This MOA may only be modified by the written agreement of the Parties, duly signed by their authorized representatives.
        - DISPUTES. Any disputes relating to this MOA will, subject to any applicable law, Executive Order, or DoD issuance, be resolved by consultation between the Parties.
        - TERMINATION OF AGREEMENT. This MOA may be terminated by either Party by giving at least __ days' written notice to the other Party. The MOA may also be terminated at any time upon the mutual written consent of the Parties.
        - TRANSFERABILITY. This MOA is not transferable except with the written consent of the Parties.
        - ENTIRE AGREEMENT. It is expressly understood and agreed that this MOA embodies the entire agreement between the Parties regarding the MOA's subject matter, thereby merging and superseding all prior agreements and representations by the Parties with respect to such subject matter.
        - EFFECTIVE DATE. This MOA takes effect beginning on the day after the last Party signs.
        - EXPIRATION DATE. This MOA expires on ________. [insert a date]
        - CANCELLATION OR MODIFICATION OF PREVIOUS AGREEMENT. This MOA modifies or cancels and supersedes the previously signed agreement between the same Parties with the subject ______, Agreement # _______ and effective date of _______. [Use this paragraph only when needed to cancel or modify a previous agreement]
        - NO THIRD PARTY BENEFICIARIES. Nothing in this MOA, express or implied, is intended to give to, or will be construed to confer upon, any person or entity not a party any remedy or claim under or by reason of this MOA and this MOA will be for the sole and exclusive benefit of the Parties.
        - SEVERABILITY. If any term, provision, or condition of this MOA is held to be invalid, void, or unenforceable by a governmental authority and such holding is not or cannot be appealed further, then such invalid, void, or unenforceable term, provision, or condition shall be deemed severed from this MOA and all remaining terms, provisions, and conditions of this MOA shall continue in full force and effect. The Parties shall endeavor in good faith to replace such invalid, void, or unenforceable term, provision, or condition with valid and enforceable terms, provisions, or conditions which achieve the purpose intended by the Parties to the greatest extent permitted by law.
        - OTHER FEDERAL AGENCIES. This MOA does not bind any federal agency, other than the Parties, nor waive required compliance with any law or regulation.

  financial_details:
    title: Financial Details
    description: "How the agreement is funded. Start with 'FINANCIAL DETAILS:'. If it isn't reimbursable, say 'This MOA does not provide for reimbursement between the Parties.' If it is, cover availability of funds, billing, payment, and the Economy Act determination."
    seed:
      $body: |
        FINANCIAL DETAILS [include Attachment A in all reimbursable MOAs; if the MOA is not reimbursable add, "This MOA does not provide for reimbursement between the Parties"]:

        - AVAILABILITY OF FUNDS. This MOA does not document the obligation of funds between the Parties. The obligation of funds by the Parties, resulting from this MOA, is subject to the availability of funds pursuant to the DoD Financial Management Regulation. No provision in this MOA will be interpreted to require obligation or payment of funds in violation of the Anti-Deficiency Act, Section 1341 of Title 31, United States Code.
        - BILLING. The [First Party] will bill the [Second Party] on a monthly basis in accordance with the procedures of the Billing Party. A record of the transaction will be sent to the [Second Party] within 30 calendar days after the month in which the transaction occurred.
        - PAYMENT OF BILLS. The [Second Party] paying office will forward payments, along with a copy of billed invoices, to the [First Party] within 30 calendar days of the date of invoice. Bills rendered will not be subject to audit in advance of payment.
        - FINANCIAL SPECIFICS. See Attachment A for all other details and information on the reimbursable support identified in this MOA. [This section must also include any allowance or advance payments to be made.]
        - ECONOMY ACT DETERMINATION AND FINDINGS (D&F). If the MOA is being entered into in accordance with Section 1535 of Title 31, United States Code (the Economy Act), both Parties agree that the requirements listed in Paragraph (a) of the Economy Act have been met. [Add the following sentence if the provider is an OSD or DoD Component] The provider has determined that the capabilities exist to render the requested support without jeopardizing its assigned missions. [Add the following sentence only if a separate, written Economy Act D&F is required.] Any required Economy Act D&F has been completed.

  list_of_attachments:
    title: List of Attachments
    description: "The agreement's attachments, for example 'Attachment A, Financial Details'. Start with 'LIST OF ATTACHMENTS:'."
    seed:
      $body: |
        LIST OF ATTACHMENTS:

        - [List each attachment here, e.g. "Attachment A, Financial Details".]

  attachment:
    title: Attachment
    description: "An attachment on its own page, lettered from B. Attachment A is reserved for financial details and is added for you when the agreement is reimbursable."
    ui:
      groups: [attachment]
    seed:
      title: "[Insert Attachment Title]"
      $body: |
        [Describe the attachment's content here.]
    fields:
      title:
        type: plaintext
        inline: true
        ui:
          group: attachment
        description: "The attachment's title."
