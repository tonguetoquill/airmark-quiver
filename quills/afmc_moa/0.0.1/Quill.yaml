quill:
  name: afmc_moa
  version: 0.0.1
  backend: typst
  description: DoD Memorandum of Agreement (DoDI 4000.19)

typst:
  plate_file: plate.typ

main:
  ui:
    groups: [parties, correspondence, terms, financial_details, signatures]
  body:
    enabled: false
  fields:
    first_party_name:
      type: plaintext
      inline: true
      ui:
        group: parties
      description: "Full organization name and acronym of the first party (the MOA's proponent). Printed as 'THE [FIRST PARTY]' in the title block and referenced throughout as '[the First Party]'."

    second_party_name:
      type: plaintext
      inline: true
      ui:
        group: parties
      description: "Full organization name and acronym of the second party. Printed as 'THE [SECOND PARTY]' in the title block."

    second_party_is_non_government:
      type: boolean
      default: false
      ui:
        group: parties
        compact: true
      description: "If the second party is a non-governmental entity, its mailing address is included in the intro paragraph identifying the Parties."

    subject:
      type: plaintext
      inline: true
      ui:
        group: parties
      description: "Subject of the agreement, printed in the title block ('FOR [SUBJECT]') and on the Attachment A cover if reimbursable."

    agreement_number:
      type: plaintext
      inline: true
      ui:
        group: parties
      description: Unique agreement identification number, printed in the title block.

    second_party_mailing_address:
      type: array
      items:
        type: plaintext
      default: []
      ui:
        group: correspondence
      description: "Second Party's mailing address for MOA correspondence and notices. Also shown in the intro paragraph if second_party_is_non_government is true."

    reimbursable:
      type: boolean
      default: false
      ui:
        group: terms
        compact: true
      description: "Whether this MOA provides for reimbursement between the Parties. When true, adds the Attachment A financial details page after the signature blocks."

    reimbursable_support:
      type: richtext
      inline: true
      default: ""
      ui:
        group: financial_details
      description: "Attachment A, item 1: description of the reimbursable support. Only used when reimbursable is true."

    estimated_amount:
      type: plaintext
      inline: true
      default: ""
      ui:
        group: financial_details
        compact: true
      description: "Attachment A, item 2: estimated amount of funds to be reimbursed, as in $50,000. Only used when reimbursable is true."

    appropriation_fy:
      type: plaintext
      inline: true
      default: ""
      ui:
        group: financial_details
        compact: true
      description: "Attachment A, item 2: appropriation fiscal year, printed after 'FY', as in 2027. Only used when reimbursable is true."

    cost_center_provider:
      type: plaintext
      inline: true
      default: ""
      ui:
        group: financial_details
        compact: true
      description: "Attachment A, item 3: provider's cost center number, if required. Only used when reimbursable is true."

    cost_center_receiver:
      type: plaintext
      inline: true
      default: ""
      ui:
        group: financial_details
        compact: true
      description: "Attachment A, item 3: receiver's cost center number, if required. Only used when reimbursable is true."

    financial_poc_provider:
      type: plaintext
      inline: true
      default: ""
      ui:
        group: financial_details
      description: "Attachment A, item 4: provider's financial point of contact. Only used when reimbursable is true."

    financial_poc_receiver:
      type: plaintext
      inline: true
      default: ""
      ui:
        group: financial_details
      description: "Attachment A, item 4: receiver's financial point of contact. Only used when reimbursable is true."

    financial_additional_info:
      type: richtext
      inline: true
      default: ""
      ui:
        group: financial_details
      description: "Attachment A, item 5: any other financial information required by DoD 7000.14-R or desired in the agreement. Only used when reimbursable is true."

    first_party_signatory:
      type: plaintext
      inline: true
      ui:
        group: signatures
      description: "Name and title of the First Party's approval authority, printed under the signature line."

    second_party_signatory:
      type: plaintext
      inline: true
      ui:
        group: signatures
      description: "Name and title of the Second Party's approval authority, printed under the signature line."

    mid_point_review_due_date:
      type: date
      ui:
        group: signatures
        compact: true
      description: "Due date for the mid-point review of the agreement, printed below the signature blocks."

card_kinds:
  background:
    title: Background
    description: "Background section (DoDI 4000.19 paragraph 1) explaining the circumstances leading to this MOA. The body opens with 'BACKGROUND:'. Optional: include it only to explain a need the purpose does not make self-evident, typically with another federal agency; between OSD or DoD Components it is normally omitted. Authored as its own card, but rendered inline as the body's numbered paragraphs — same chained decimal numbering as the rest of the body, no page break. Exactly one is expected; if more than one is supplied, only the first is used. Renders before authorities."

  authorities:
    title: Authorities
    description: "Authorities section citing the legal basis for this MOA. The body opens with 'AUTHORITIES:' and states the legal authority for the MOA, such as the Economy Act, and each Party's authorities. Another federal agency's own asserted authority is prefaced 'The [Party] asserts the following authority:'; DoD need not agree with it. Authored as its own card, but rendered inline as the body's numbered paragraphs — same chained decimal numbering as the rest of the body, no page break. Exactly one is expected; if more than one is supplied, only the first is used. Renders after background, before purpose_and_scope."

  purpose_and_scope:
    title: Purpose and Scope
    description: "Purpose and Scope section describing what this MOA establishes. The body opens with 'PURPOSE AND SCOPE:' and states the MOA's purpose and scope. Every MOA includes it. Authored as its own card, but rendered inline as the body's numbered paragraphs — same chained decimal numbering as the rest of the body, no page break. Exactly one is expected; if more than one is supplied, only the first is used. Renders after authorities, before responsibilities_of_the_parties."

  responsibilities_of_the_parties:
    title: Responsibilities of the Parties
    description: "Responsibilities of the Parties section listing each party's obligations under this MOA. The body opens with 'RESPONSIBILITIES OF THE PARTIES:', then a list item per Party ('The [First Party] will—', 'The [Second Party] will—', 'Both Parties will—'), each nesting every specific obligation of that Party. Authored as its own card, but rendered inline as the body's numbered paragraphs — same chained decimal numbering as the rest of the body, no page break. Exactly one is expected; if more than one is supplied, only the first is used. Renders after purpose_and_scope, before personnel."

  personnel:
    title: Personnel
    description: "Personnel section describing each party's responsibility for its own personnel costs. The body opens with 'PERSONNEL:' and states each Party's responsibility for all costs of its personnel (pay and benefits, support, travel) and for their supervision and management, with the process for any shared supervision. Authored as its own card, but rendered inline as the body's numbered paragraphs — same chained decimal numbering as the rest of the body, no page break. Exactly one is expected; if more than one is supplied, only the first is used. Renders after responsibilities_of_the_parties, before general_provisions."

  general_provisions:
    title: General Provisions
    description: "General Provisions section covering points of contact, termination, expiration, and other standard MOA terms. The body opens with 'GENERAL PROVISIONS:', then a list of DoDI 4000.19's standard provisions, each led by its capitalized title: POINTS OF CONTACT (a primary and an alternate POC per Party, each with name, position, office, phone and email), CORRESPONDENCE, REVIEW OF AGREEMENT (a non-reimbursable MOA at least at mid-point, a reimbursable one annually for financial impacts), MODIFICATION OF AGREEMENT, DISPUTES, TERMINATION OF AGREEMENT (its days of written notice), TRANSFERABILITY, ENTIRE AGREEMENT, EFFECTIVE DATE, EXPIRATION DATE, NO THIRD PARTY BENEFICIARIES, SEVERABILITY and OTHER FEDERAL AGENCIES. CANCELLATION OR MODIFICATION OF PREVIOUS AGREEMENT, naming that agreement's subject, number and effective date, appears only when this MOA supersedes one. Authored as its own card, but rendered inline as the body's numbered paragraphs — same chained decimal numbering as the rest of the body, no page break. Exactly one is expected; if more than one is supplied, only the first is used. Renders after personnel, before financial_details."

  financial_details:
    title: Financial Details
    description: "Financial Details section (DoDI 4000.19 paragraph 7) covering availability of funds, billing, payment, and Economy Act determination. The body opens with 'FINANCIAL DETAILS:'. A non-reimbursable MOA follows it with 'This MOA does not provide for reimbursement between the Parties.' A reimbursable one lists AVAILABILITY OF FUNDS, BILLING, PAYMENT OF BILLS, FINANCIAL SPECIFICS (referring to Attachment A and stating any allowance or advance payments) and ECONOMY ACT DETERMINATION AND FINDINGS (D&F). The D&F adds that the provider can render the support without jeopardizing its missions when the provider is an OSD or DoD Component, and that any required D&F is completed when a separate written one is required. Authored as its own card, but rendered inline as the body's numbered paragraphs — same chained decimal numbering as the rest of the body, no page break. Exactly one is expected; if more than one is supplied, only the first is used. Renders after general_provisions, before list_of_attachments."

  list_of_attachments:
    title: List of Attachments
    description: "List of Attachments section enumerating this MOA's attachments. The body opens with 'LIST OF ATTACHMENTS:', then a list item per attachment, as in 'Attachment A, Financial Details'. Authored as its own card, but rendered inline as the body's numbered paragraphs — same chained decimal numbering as the rest of the body, no page break. Exactly one is expected; if more than one is supplied, only the first is used. Renders last, after financial_details, immediately before the signature blocks."

  attachment:
    title: Attachment
    description: "A lettered attachment to the MOA, starting at Attachment B (Attachment A is reserved for the reimbursable financial-details page and is generated automatically when 'reimbursable' is true). Each card starts on its own page."
    ui:
      groups: [attachment]
    fields:
      title:
        type: plaintext
        inline: true
        ui:
          group: attachment
        description: "Subject of the attachment, printed on the cover line ('to [subject], [agreement_number] [title]')."
