quill:
  name: personal_letter
  version: 0.1.0
  backend: typst
  plate_file: plate.typ
  description: U.S. Air Force Personal Letter (AFH 33-337, Chapter 15 — The Tongue and Quill)

main:
  body:
    example: |
      The text of the letter. The first line of each major paragraph is indented 0.5 inches. All second and subsequent lines are flush with the left margin. Keep the letter brief, preferably no longer than one page, and avoid acronyms.

      A second paragraph, if needed.

      - A sub-paragraph, automatically lettered (a., b., c., etc.).
  fields:
    return_address:
      type: array
      required: true
      example:
        - "Chief Master Sergeant David L. Jones"
        - Duty Title
        - Organization
        - Street Address
        - City ST 12345-6789
      ui:
        group: Heading
      description: "Sender's rank, full name, duty title, organization, and complete mailing address (single-spaced). Placed flush left on the second line below the date. Use periods after Mr., Ms., Mrs., Dr. No punctuation on the last line except the ZIP+4 dash."

    receiver_address:
      type: array
      required: true
      example:
        - "Lieutenant Colonel Getty A. Letter"
        - Duty Title
        - Organization
        - Street Address
        - City ST 12345-6789
      ui:
        group: Heading
      description: "Recipient's title or rank, full name, and complete mailing address (single-spaced). Placed on the third line below the return address. Spell out all military ranks in full."

    salutation:
      type: string
      required: true
      example: "Dear Colonel Letter"
      ui:
        group: Heading
      description: "Begins with 'Dear' followed by the title (or rank) and last name of the receiver. No punctuation after the salutation (open punctuation style)."

    signature_block:
      type: array
      required: true
      example:
        - "DAVID L. JONES, CMSgt, USAF"
        - Duty Title
      ui:
        group: Closing
      description: "Full signature block of the sender. Line 1: Name in UPPERCASE as signed, grade, and service. Line 2: Duty title."

    addressee_type:
      type: string
      enum:
        - military
        - civilian
      default: military
      ui:
        group: Heading
        compact: true
      description: "Controls the date format. Military/government addressees: 'Day Month Year' (15 October 2014). Civilian addressees: 'Month Day, Year' (October 15, 2014)."

    attachments:
      type: array
      default: []
      example:
        - Attachment description
      ui:
        group: Closing
      description: "'Attachment:' for a single attachment; '# Attachments:' for two or more. Placed flush left on the third line below the signature element."

    cc:
      type: array
      default: []
      example:
        - "Rank and Name, ORG/SYMBOL"
      ui:
        group: Closing
      description: "Courtesy copy recipients. Placed on the second line below the attachment element, or the third line below the signature if no attachment is used."

    letterhead_title:
      type: string
      default: "DEPARTMENT OF THE AIR FORCE"
      ui:
        group: Heading
        compact: true
      description: "Official department title printed in the letterhead. Change only for joint commands or DoD agencies."

    letterhead_caption:
      type: array
      default: []
      example:
        - HEADQUARTERS [UNIT NAME]
      ui:
        group: Heading
      description: "Unit name printed below the department title in the letterhead. Leave blank to omit the letterhead entirely."

    letterhead_seal:
      type: string
      enum:
        - dow
        - dod
      default: dow
      ui:
        group: Heading
        compact: true
      description: "Seal displayed in the letterhead. 'dow' for the Department of War seal (Air Force); 'dod' for the Department of Defense seal."

    font_size:
      type: number
      default: 12
      example: 12
      ui:
        group: Format
        compact: true
      description: Font size for the letter text (pt). Decimal values (e.g. 11.5) are supported.

    date:
      type: date
      default: ""
      ui:
        group: Format
        compact: true
      description: YYYY-MM-DD. Leave blank to use today's date.

    classification:
      type: string
      enum:
        - ""
        - UNCLASSIFIED
        - CUI
        - CONFIDENTIAL
        - SECRET
        - TOP SECRET
      default: ""
      ui:
        group: Format
        compact: true
      description: "Classification marking in the header/footer banner. Follows DoD/CAPCO color guidance. Leave blank to omit."

    dissemination:
      type: string
      default: ""
      ui:
        group: Format
        compact: true
      description: "Marking appended after double slash (e.g. NF with CUI renders as CUI//NF). Leave blank for classification only."
