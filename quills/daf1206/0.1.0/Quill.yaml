quill:
  name: daf1206
  version: 0.1.0
  backend: typst
  description: "DAF Form 1206 — Nomination for Award"

typst:
  plate_file: plate.typ

main:
  description: List the nominee's specific accomplishments in the body, one bullet each.
  body:
    example: |-
      **Leadership & job performance in primary duty**

      - Led 14-member evaluation cell; certified 32 weapons directors on air defense tasks—zero repeat findings
      - Rewrote squadron evaluation checklist; cut certification time 20% and set the group standard
      - Directed no-notice readiness exercise for 120 personnel; unit rated "Effective" by wing inspectors
      - Tracked 410 training records; closed 96 overdue items in 30 days and restored 100% currency
      - Built mission-planning cell for Red Flag; controlled 1.2K sorties and 45 simulated engagements—zero safety events
      - Stood up tactical data link test bench; verified 18 radios and saved $30K in contractor support
      - Hand-picked as acting flight chief for 45 days; led 22 Airmen through 300 live control missions
      - Revamped shift turnover brief; cut console handoff errors 40% across four crews
      - Managed $85K equipment account; zero discrepancies on annual inventory of 212 line items
      - Drafted 12 local operating procedures; adopted by two sister squadrons within the group
      - Coordinated radar outage recovery with FAA and NORAD; restored surveillance coverage in 3 hours
      - Trained 9 new Airmen on classified material handling; unit passed security inspection with no findings
      - Rebuilt crew duty schedule for 24/7 operations; cut overtime 15% with no gaps in coverage
      - Authored 6 exercise scenarios; stressed 4 crews on degraded-mode control and data link failure

      **Significant self-improvement**

      - Completed NCO Academy with distinction; earned John L. Levitow Award over 180 peers
      - Earned CCAF degree in Air and Space Operations; 3.9 GPA while deployed for 60 days
      - Completed 12 credit hours toward B.S. in Information Systems; 4.0 GPA
      - Qualified as unit fitness assessment cell monitor; tested 60 members with zero errors
      - Mentored three Airmen through upgrade training; all certified 30 days early

      **Base or community involvement**

      - Organized 40-volunteer base cleanup; restored two miles of shoreline trail
      - Led unit holiday food drive; collected 1.6K pounds of food for 90 families
      - Volunteered 60 hours at base airman's attic; sorted 2K donated items for junior enlisted families
      - Served as squadron booster club treasurer; raised $4K for unit morale events
      - Tutored 15 students in weekly middle school math program; class pass rate rose 18%
      - Directed base 5K run for Wounded Warrior Project; 300 runners raised $6K
  fields:
    award:
      type: text
      default: ""
      example: Outstanding Performer of the Quarter
    category_if_applicable:
      type: text
      default: ""
      example: NCO
      ui:
        compact: true
    award_period:
      type: text
      default: ""
      example: 1 Jan 2026 – 31 Mar 2026
      description: The period the award covers, for example 1 Jan 2026 – 31 Mar 2026.
      ui:
        compact: true
    rankname_of_nominee:
      type: text
      default: ""
      example: SSgt John A. Doe
      description: The nominee's rank and name, for example MSgt JANE A. DOE.
      ui:
        compact: true
    majcom_fldcom_foa_or_dru:
      type: text
      default: ""
      example: ACC
      description: The abbreviation, for example ACC.
      ui:
        compact: true
    dafsc_duty_title:
      type: text
      default: ""
      example: 1C571, NCOIC, Standardization and Evaluation
      description: The nominee's DAFSC and duty title.
    nominees_telephone_dsn_commercial:
      type: text
      default: ""
      example: DSN 555-1234 / (555) 555-1234
      description: DSN and commercial numbers, for example DSN 555-1234 / (555) 555-1234.
    unit_office_symbol_street_address_base_state_zip:
      type: text
      default: ""
      example: 1 ACS/DOV, 123 Main St, Example AFB FL 32403
      description: Unit, office symbol, and full address on one line.
    unit_commander_rank_name_and_telephone:
      type: text
      default: ""
      example: Lt Col Jane B. Smith, (555) 555-5678
      description: The commander's rank, name, and phone number.

card_kinds:
  accomplishments_continued:
    title: Specific Accomplishments (Continued — Page 2)
    description: Continues the accomplishments on page 2. Add it only when they don't fit on page 1.
    body:
      example: |-
        **Base or community involvement (continued)**

        - Coached 12-player youth soccer team; secured $2K in sponsor donations for league equipment
        - Led Honor Guard detail at 14 funerals and ceremonies; rendered final honors for three veterans
    seed:
      $body: |
        **Category (continued)**

        - Continued accomplishment bullet
