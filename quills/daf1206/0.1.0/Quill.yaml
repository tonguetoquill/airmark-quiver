quill:
  name: daf1206
  version: 0.1.0
  backend: typst
  description: "DAF Form 1206 — Nomination for Award"

typst:
  plate_file: plate.typ

main:
  description: List the nominee's specific accomplishments in the body, one bullet each.
  fields:
    award:
      type: text
      default: ""
    category_if_applicable:
      type: text
      default: ""
      ui:
        compact: true
    award_period:
      type: text
      default: ""
      description: The period the award covers, for example 1 Jan 2026 – 31 Mar 2026.
      ui:
        compact: true
    rankname_of_nominee:
      type: text
      default: ""
      description: The nominee's rank and name, for example MSgt JANE A. DOE.
      ui:
        compact: true
    majcom_fldcom_foa_or_dru:
      type: text
      default: ""
      description: The abbreviation, for example ACC.
      ui:
        compact: true
    dafsc_duty_title:
      type: text
      default: ""
      description: The nominee's DAFSC and duty title.
    nominees_telephone_dsn_commercial:
      type: text
      default: ""
      description: DSN and commercial numbers, for example DSN 555-1234 / (555) 555-1234.
    unit_office_symbol_street_address_base_state_zip:
      type: text
      default: ""
      description: Unit, office symbol, and full address on one line.
    unit_commander_rank_name_and_telephone:
      type: text
      default: ""
      description: The commander's rank, name, and phone number.

card_kinds:
  accomplishments_continued:
    title: Specific Accomplishments (Continued — Page 2)
    description: Continues the accomplishments on page 2. Add it only when they don't fit on page 1.
    seed:
      $body: |
        **Category (continued)**

        - Continued accomplishment bullet
