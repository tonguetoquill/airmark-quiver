quill:
  name: daf1206
  version: 0.1.0
  backend: typst
  description: "DAF Form 1206 — Nomination for Award"

typst:
  plate_file: plate.typ

main:
  description: The body holds the specific accomplishments, one bullet per line.
  fields:
    award:
      type: string
      default: ""
    category_if_applicable:
      type: string
      default: ""
      ui:
        compact: true
    award_period:
      type: string
      default: ""
      description: Date range, as in 1 Jan 2026 – 31 Mar 2026.
      ui:
        compact: true
    rankname_of_nominee:
      type: string
      default: ""
      description: Rank and name, as in RANK FIRST M. LAST.
      ui:
        compact: true
    majcom_fldcom_foa_or_dru:
      type: string
      default: ""
      description: Abbreviation, as in ACC.
      ui:
        compact: true
    dafsc_duty_title:
      type: string
      default: ""
      description: DAFSC, then duty title.
    nominees_telephone_dsn_commercial:
      type: string
      default: ""
      description: DSN and commercial numbers, as in DSN XXX-XXXX / (XXX) XXX-XXXX.
    unit_office_symbol_street_address_base_state_zip:
      type: string
      default: ""
      description: One line, as in UNIT/SYMBOL, STREET, BASE ST ZIP.
    unit_commander_rank_name_and_telephone:
      type: string
      default: ""
      description: Rank, name and telephone, as in RANK FIRST M. LAST, (XXX) XXX-XXXX.

card_kinds:
  accomplishments_continued:
    title: Specific Accomplishments (Continued — Page 2)
    description: Optional. Add this card only when page 2 overflow is required. Use the card body for continued bullets, one per line. Rank/name on page 2 matches the main nominee line automatically.
