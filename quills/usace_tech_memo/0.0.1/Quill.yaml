quill:
  name: usace_tech_memo
  version: 0.0.1
  backend: typst
  description: USACE Technical Memorandum

typst:
  plate_file: plate.typ

main:
  description: "The four standard sections are Heading 1s: Purpose, Summary (optional), Discussion, Recommendation, then References. They print like the ENC template's Heading 2: 12 pt bold capitals, numbered 1.1, no page break. Headings 1 to 3 appear in CONTENTS. Heading 5 is bold underlined; Heading 6 is underlined. Caption a table, figure, or equation above it. Notes are paragraphs that start with Note., not footnotes."
  body:
    example: |-
      # Purpose

      This memorandum documents peak-flow frequency at the Cowlitz River near Castle Rock, Washington, for use in the Lower Columbia Stage Frequency Study. It states the recommended 10-, 2-, 1-, and 0.2-percent annual exceedance probability (AEP) discharges and the stages that go with them.

      # Summary

      The recommended 1-percent AEP peak flow at Castle Rock is 226,000 cubic feet per second (cfs), at a stage of 54.0 feet NAVD88. The estimate uses the systematic record from water years 1928 through 2021, with the 2008 event treated as a historic peak. Bulletin 17C procedures, as implemented in HEC-SSP, are the computational method.

      # Discussion

      ## Streamgage record

      The Castle Rock gage has a systematic peak-flow record of 94 years. The 2008 peak of 142,000 cfs is the flood of record in the systematic sample. Two earlier peaks, in 1933 and 1996, exceed 100,000 cfs.

      The rating in effect for water years 2012 through 2021 is the rating adopted in ENC-21-009. High-flow measurements in 1996 and 2008 anchor the upper end.

      ##### Record period.

      The systematic record starts in water year 1928, when the gage was established, and ends in water year 2021, the last year on the hydrograph used for this memorandum.

      ## Frequency analysis

      Bulletin 17C expected moments algorithm estimates, with a regional skew of −0.21 and a mean-square error of 0.14, are the adopted frequencies. Low outliers were not identified.

      1. Screen the systematic peaks for low outliers and for peaks affected by regulation.
         1. Compare each peak to the Multiple Grubbs-Beck threshold.
         2. Flag a peak that is not a natural flow.
            1. Document the regulation or break in the station history.
            2. Decide whether the peak stays in the sample.
               1. Keep it when the regulation is minor at the flood peak.
               2. Remove it when the peak is not a natural Cowlitz flow.
                  1. Record the decision in the hydrologic calculations in Appendix B.
                  2. Recalculate the EMA fit without that peak.
      2. Fit the log-Pearson Type III distribution with the expected moments algorithm.
      3. Plot the adopted frequency curve against the plotting positions.

      The adopted peaks are:

      | AEP | Peak flow (cfs) | Stage (ft, NAVD88) |
      | --- | ---: | ---: |
      | 0.10 | 142,000 | 48.2 |
      | 0.02 | 198,000 | 52.1 |
      | 0.01 | 226,000 | 54.0 |
      | 0.002 | 278,000 | 56.8 |

      **Note.** Peak flows are unregulated. Stages are read from the ENC-21-009 rating.

      The channel-forming check uses the 1-percent AEP unit discharge.


      The results compare with the 2012 FEMA study to within 6 percent at the 1-percent AEP. The difference is the longer systematic record and the Bulletin 17C treatment of the 2008 peak.

      # Recommendation

      The PDT should adopt the peak flows and stages in this memorandum for the Lower Columbia Stage Frequency Study at Castle Rock. Appendix A holds the plates; Appendix B holds the hydrologic calculations.

      # References

      England, J. F., Jr., T. A. Cohn, B. A. Faber, J. R. Stedinger, W. O. Thomas Jr., A. G. Veilleux, J. E. Kiang, and R. R. Mason Jr. 2019. *Guidelines for Determining Flood Flow Frequency—Bulletin 17C.* Techniques and Methods 4-B5. Reston, VA: U.S. Geological Survey.

      U.S. Army Corps of Engineers. 2021. *Hydrology methodology for the Lower Columbia Stage Frequency Study.* Technical Memorandum ENC-21-004. Portland, OR: Portland District.

      U.S. Army Corps of Engineers. 2021. *Rating curve at Castle Rock.* Technical Memorandum ENC-21-009. Portland, OR: Portland District.
  fields:
    memo:
      type: object
      properties:
        memo_number:
          type: text
          ui:
            compact: true
          example: ENC-22-001
          description: "The number after TECHNICAL MEMORANDUM NO., for example ENC-22-001."

        location_lines:
          type: array
          items:
            type: text
          default: []
          example:
            - COWLITZ RIVER
            - COLUMBIA RIVER BASIN
            - WASHINGTON
          description: "Stacked location lines, printed in capitals, for example COWLITZ RIVER, COLUMBIA RIVER BASIN, WASHINGTON."

        study_name:
          type: text
          example: Lower Columbia Stage Frequency Study
          description: "The study this memorandum belongs to, for example Lower Columbia Stage Frequency Study."

        subject:
          type: text
          example: Peak flow frequency at Castle Rock, Washington
          description: "The memorandum's topic line, under the study name on the title page."

        prepared_for:
          type: text
          default: ""
          example: Federal Emergency Management Agency
          description: "Who the memorandum is prepared for, for example Federal Emergency Management Agency."

        prepared_by:
          type: text
          default: ""
          example: U.S. Army Corps of Engineers, Portland District
          description: "The preparing office, printed as Prepared by: on the title page, for example U.S. Army Corps of Engineers, Portland District. Leave blank to omit the line."

        date:
          type: date
          default: ""
          ui:
            compact: true
          example: 2022-04-19
          description: "The date on the title page, printed as day month year with the month spelled out, for example 19 April 2022."

        include_summary:
          type: boolean
          default: true
          ui:
            compact: true
          example: true
          description: "Whether this memorandum has a Summary section. Turn it off and delete the Summary heading from the body when there is none."

    cui:
      type: object
      title: CUI
      properties:
        marking:
          type: enum
          default: "off"
          ui:
            compact: true
          example: banners_and_cover
          description: "Which CUI markings print. off prints no banners and no Standard Form 901 cover, and is what a new document does. banners prints the CUI banner at the top and bottom of every page, with the designation block, distribution statement and export warning at the bottom right of the first page. banners_and_cover prints those banners and the purple cover, and the designation block prints on the cover instead. The cover never prints without the banners."
          values:
            - "off"
            - banners
            - banners_and_cover

        controlled_by_component:
          type: text
          default: ""
          example: USACE
          description: "The component that controls the CUI, for example USACE. Used when banners are on."

        controlled_by_office:
          type: text
          default: ""
          example: CENWP-EC
          description: "The office that controls the CUI, for example CENWP-EC. Used when banners are on."

        categories:
          type: array
          items:
            type: text
          default: []
          example:
            - CTI
            - CEII
          description: "CUI categories from the DoD CUI Registry, for example CTI or CEII. Used when banners are on."

        distribution:
          type: enum
          default: ""
          example: FED ONLY
          description: "Statement A cannot be used when banners are on. Distribution/Limited Dissemination Control: a Distribution Statement A to F, or a Limited Dissemination Control, for example FED ONLY. Leave blank when markings are off. When banners are on, a blank prints a note telling you to choose a distribution and does not fill one in."
          values:
            - "Distribution Statement A"
            - "Distribution Statement B"
            - "Distribution Statement C"
            - "Distribution Statement D"
            - "Distribution Statement E"
            - "Distribution Statement F"
            - "FED ONLY"
            - "FEDCON"
            - "NOCON"
            - "NOFORN"
            - Other
          variants:
            Other:
              detail:
                type: text
                description: "A Limited Dissemination Control or distribution statement not listed above."

        distribution_reason:
          title: Distribution reason
          type: array
          max: 3
          default:
            - Controlled Technical Information
          example:
            - Controlled Technical Information
          description: "Up to three DoDI 5230.24 defense categories behind Distribution Statement B to F, printed by their full category headings under the designation block. Export Controlled also prints the export-control warning and requires statement B, C, D, or E."
          items:
            type: enum
            values:
              - Controlled Technical Information
              - Contractor Performance Evaluation
              - Critical Technology
              - Direct Military Support
              - Export Controlled
              - Foreign Government Information
              - International Agreements
              - Operations Security
              - Patents and Inventions
              - Proprietary Business Information
              - Small Business Innovation Research
              - Software Documentation
              - Test and Evaluation
              - Vulnerability Information

        distribution_date:
          title: Date of determination
          type: date
          default: ""
          ui:
            compact: true
          example: 2022-04-19
          description: "When the controlling office assigned the distribution statement, printed as 18 OCT 2008. Used with Distribution Statement B to F."

        distribution_office:
          title: Refer requests to
          type: text
          default: ""
          description: "The controlling DoD office, with its address, that the distribution statement refers other requests to. Leave blank to use the controlling office above. Statement F does not print until this office or the controlling office is filled in."

        poc:
          title: POC
          type: text
          default: ""
          example: Jane Q. Engineer, CENWP-EC-H, 503-555-0142
          description: "Who to contact about this CUI, with a phone or office mailbox. Used when banners are on."

    front_matter:
      type: object
      title: Front matter
      properties:
        appendices:
          type: array
          default: []
          ui:
            layout: table
          items:
            type: object
            properties:
              letter:
                type: text
                description: "The appendix letter, for example A. Leave blank to letter from A in order."
              title:
                type: text
                description: "The appendix title, for example PLATES."
          example:
            - letter: A
              title: PLATES
            - letter: B
              title: HYDROLOGIC CALCULATIONS
          description: "Appendices listed in the front matter. The page is omitted when this list is empty."

        pertinent_data:
          type: richtext
          shape: blocks
          default: ""
          example: |-
            Drainage area at Castle Rock: 2,240 square miles

            Period of record: water years 1928–2021

            Project datum: NAVD88
          description: "Optional pertinent data. Leave blank to omit this page."

        previous_memos:
          title: Previous memorandums
          type: array
          default: []
          ui:
            layout: table
          items:
            type: object
            properties:
              number:
                type: text
                description: "The previous memorandum's number."
              title:
                type: text
                description: "The previous memorandum's title."
              date:
                type: date
                default: ""
                description: "Its date, printed in the table as MM/DD/YYYY."
          example:
            - number: ENC-21-004
              title: Hydrology methodology for the Lower Columbia Stage Frequency Study
              date: 2021-06-15
            - number: ENC-21-009
              title: Rating curve at Castle Rock
              date: 2021-11-02
          description: "Earlier memorandums in this series. The page is omitted when this list is empty."

        acronyms:
          type: array
          ui:
            layout: table
          items:
            type: object
            properties:
              acronym:
                type: text
                description: "The acronym, for example USACE."
              description:
                type: text
                description: "What it stands for."
          default: []
          example:
            - acronym: AEP
              description: Annual Exceedance Probability
            - acronym: CEII
              description: Critical Energy Infrastructure Information
            - acronym: CTI
              description: Critical Infrastructure Information
            - acronym: cfs
              description: cubic feet per second
            - acronym: PDT
              description: Project Delivery Team
            - acronym: USACE
              description: U.S. Army Corps of Engineers
          description: "Acronyms used in the memorandum. They print alphabetically. The page is omitted when this list is empty."

