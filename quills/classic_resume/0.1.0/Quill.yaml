quill:
  name: classic_resume
  version: 0.1.0
  backend: typst
  description: Classic single-page resume

typst:
  plate_file: plate.typ

# Two kinds: a section is a heading (and, for Skills and Certifications, the
# list under it); an entry is a row. Entries after a section print under it
# until the next section. The topic names the world; the title, when filled,
# is what prints.
main:
  ui:
    groups: [identity, page]
  # Everything prints under a section heading, so main carries no body: a
  # summary is a section whose topic is Summary.
  body:
    enabled: false
  fields:
    name:
      type: string
      example: John Doe
      ui:
        group: identity
      description: "Your name, set large at the top. It is the document's level 1 heading, and becomes the exported PDF's title and author."

    contacts:
      type: array
      items:
        type: string
      example:
        - john.doe@example.com
        - (555) 123-4567
        - github.com/johndoe
        - linkedin.com/in/johndoe
        - Pittsburgh, PA
      ui:
        group: identity
      description: "The line under your name, one contact per line here, printed across the page separated by a diamond. Order them by how much you want them used."

    link_contacts:
      type: boolean
      default: true
      ui:
        group: identity
        compact: true
      description: "Turn contacts that look like an email address, a web address or a phone number into live links in the PDF. Anything else — a city, a clearance level — is printed as written."

    paper:
      type: enum
      values:
        - us-letter
        - a4
      default: us-letter
      ui:
        group: page
        compact: true
      description: "Page size."

    font_size:
      type: number
      default: 12
      ui:
        group: page
        compact: true
      description: "Body text size in points; decimals allowed, such as 11.5. Along with the margin, this is the lever for fitting a resume onto one page — drop a half point before you drop a bullet."

    margin:
      type: number
      default: 0.5
      ui:
        group: page
        compact: true
      description: "Page margin in inches, the same on all four sides. The layout is dense by design; below about 0.4 a printer starts clipping."

card_kinds:
  section:
    description: "A heading in uppercase over a rule. Experience, Education, Projects and Other take the entry cards that follow, until the next section. Skills and Certifications are the list on this card. Summary is the heading plus the prose in the body. Other is the heading you type when the list above does not name it."
    ui:
      title: Section
    body:
      # An omitted example seeds "Write section body here."; empty is a heading
      # with no prose, which is the usual section.
      example: ""
      # The name (level 1) and the section titles (level 2) carry the PDF's
      # structure tree; a heading authored in a body lands in that outline
      # unannounced. The rest no resume component typesets.
      unsupported: [heading, rule, code, table, image]
    fields:
      topic:
        type: enum
        values:
          - experience
          - education
          - projects
          - skills
          - certifications
          - summary
          - other
        default: experience
        example: experience
        ui:
          compact: true
        description: "What this block is for. Experience, Education, Projects and Other take a heading and the entry cards that follow, until the next section. Skills and Certifications are the list on this card — there are no entries to add. Summary is the heading plus the prose in the body. Other is the heading you type when the list above does not name it: volunteer, military, publications, a competition."
        variants:
          skills:
            labeled_items:
              type: array
              items:
                type: object
                properties:
                  label:
                    type: plaintext
                    inline: true
                    example: Programming
                    description: "Set in bold on its own line above the text."
                  text:
                    type: plaintext
                    inline: true
                    example: Python, R, JS, Rust, PowerShell, CI/CD
                    description: "The items under that label, usually comma separated. Printed as written — markup is the one thing a labeled row does not carry."
              example:
                - label: Programming
                  text: "Python, R, JS, C#, Rust, PowerShell, CI/CD"
                - label: Data Science
                  text: "ML/statistics, TensorFlow, AI Engineering"
                - label: IT & Cybersecurity
                  text: "AD DS, Splunk, Metasploit, Wireshark, Nessus"
                - label: Cloud
                  text: "AWS EC2/S3, Helm, Docker, Serverless"
              description: "One label and its items per row, filled across the columns and then down."
            columns:
              type: integer
              default: 2
              ui:
                compact: true
              description: "Number of columns. Two suits items that run most of a line; three suits single words."
          certifications:
            items:
              type: array
              items:
                type: richtext
                inline: true
              example:
                - Offensive Security Certified Professional (OSCP)
                - GIAC Cyber Threat Intelligence (GCTI)
                - CompTIA CASP+, CySA+, Sec+, Net+, A+, Proj+
                - GIAC Machine Learning Engineer (GMLE)
              description: "One item per line, filled across the columns and then down. Keep each to a line at the column width. Italicize with *asterisks*."
            columns:
              type: integer
              default: 2
              ui:
                compact: true
              description: "Number of columns. Two suits items that run most of a line; three suits single words."

      title:
        type: plaintext
        inline: true
        default: ""
        example: Work Experience
        ui:
          group: heading
        description: "Printed in uppercase over a rule. Leave blank to use the usual heading for the topic — 'Work Experience', 'Education', 'Projects', 'Skills', 'Certifications', 'Summary'. Other has no usual heading; fill this in."

      extra:
        type: richtext
        inline: true
        default: ""
        ui:
          group: heading
          compact: true
        description: "Qualifier set after the title in the same style, such as a date range or a clarifier. Italicize with *asterisks*. Leave blank for the usual case."

  entry:
    description: "A row under the section above it. Dated is a job, a degree, an award: heading and dates on the first line, role and location on the second, bullets in the body. Linked is a project: heading and a URL, no second line. Leave both the role and the location blank and that second line is not printed. A row is never split across a page break."
    ui:
      title: "{heading}"
    body:
      example: |
        - What you did, and what came of it. One line each, strongest first.
      unsupported: [heading, rule, code, table, image]
    fields:
      heading:
        type: plaintext
        inline: true
        example: Carnegie Mellon University
        description: "Left side of the first line, set in bold. Company, school, award, or project name, depending on the section."

      form:
        type: enum
        values:
          - dated
          - linked
        default: dated
        example: dated
        ui:
          compact: true
        description: "Dated puts dates opposite the heading and an optional role or degree under it. Linked puts a URL opposite the heading, small and italic, and drops the second line. A job with a company URL is a dated row under Experience, not a switch to Linked."
        variants:
          dated:
            dates:
              type: plaintext
              inline: true
              default: ""
              example: August 2024 – Present
              ui:
                compact: true
              description: "Set in bold at the right, opposite the heading. Free text rather than a date, so a range reads as you write it: 'August 2024 – Present', 'December 2025'. Keep the form the same down the page."
            subtitle:
              type: plaintext
              inline: true
              default: ""
              example: Master of Information Technology Strategy
              description: "Role, degree or placing, set in italics below the heading. Leave blank to omit."
            location:
              type: plaintext
              inline: true
              default: ""
              example: Pittsburgh, PA
              ui:
                compact: true
              description: "Set in italics below the dates. 'Pittsburgh, PA', 'Remote'. Leave blank to omit."
          linked:
            url:
              type: string
              default: ""
              example: https://github.com/nibsbin/quillmark
              ui:
                compact: true
              description: "Set small and italic at the right, and made a live link when it starts with http. Anything else is printed as written, so '<closed source>' stands in for a project with nothing to link. Leave blank to omit."
