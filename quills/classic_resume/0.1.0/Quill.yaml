quill:
  name: classic_resume
  version: 0.1.0
  backend: typst
  description: Classic single-page resume

typst:
  plate_file: plate.typ

# A resume is a stack of sections, and each kind of section is a card kind: a
# heading, optional prose under it, and the rows that section holds. The rows
# are the section's own, so an entry cannot land under the wrong heading.
main:
  description: "Your name and contacts head the page. Each section under them is a card, printed in the order the cards stand: add a card for every section you want."
  ui:
    groups: [identity, page]
  # Everything prints under a section heading, so main carries no body: a
  # summary is a Summary card.
  body:
    enabled: false
  fields:
    name:
      type: string
      ui:
        group: identity
      description: "Your name as you want it read, set large at the top. It also titles the exported PDF."

    contacts:
      type: array
      items:
        type: string
      ui:
        group: identity
      description: "How to reach you, one per line and the one you want used first: an email address, a phone number, a profile such as linkedin.com/in/you, a city. They print in that order across the page under your name, a diamond between each. An email address, a web address or a phone number becomes a live link in the PDF."

    paper:
      type: enum
      values:
        - us-letter
        - a4
      default: us-letter
      ui:
        group: page
        compact: true
      description: "Page size."

    font_size:
      type: number
      default: 12
      ui:
        group: page
        compact: true
      description: "Body text size in points, such as 11 or 11.5. Along with the margin, this is the lever for fitting a resume onto one page — drop a half point before you drop a bullet."

    margin:
      type: number
      default: 0.5
      ui:
        group: page
        compact: true
      description: "Page margin in inches, the same on all four sides. The layout is dense by design; below about 0.4 a printer starts clipping."


# Each kind opens with the heading it prints. Its `default:` is the usual one,
# so a new card shows the heading it will print, and an authored "" prints
# none.
card_kinds:
  summary:
    title: Summary
    description: "Prose under a heading: a few lines on who you are and the work you want next. Retitled, it is any section that is only prose, such as an objective."
    seed:
      $body: An engineer. Likes climbing rocks and making useful things.
    fields:
      title:
        type: plaintext
        inline: true
        default: Summary
        description: "Printed in uppercase over a rule. An empty title prints no heading, so a summary that is the first card sits straight under your name."

  experience:
    title: Experience
    description: "Jobs, most recent first: employer and dates on the first line, role and location on the second, details under them. Prose written under the card prints under the heading, ahead of the jobs."
    seed:
      jobs:
        - company: Employer
          dates: Month YYYY – Present
          role: Job Title
          location: City, ST
          details: |
            - What you did, and what it changed.
    fields:
      title:
        type: plaintext
        inline: true
        default: Work Experience
        description: &title_description "Printed in uppercase over a rule. An empty title prints no heading."
      jobs:
        type: array
        items:
          type: object
          properties:
            company:
              type: plaintext
              inline: true
              description: "Set in bold at the left of the first line."
            dates: &dates
              type: plaintext
              inline: true
              default: ""
              description: "Set in bold at the right of the first line. Free text rather than a date, so a range reads as you write it: 'August 2024 – Present', 'December 2025'. Keep the form the same down the page."
            role:
              type: plaintext
              inline: true
              default: ""
              description: "Your title, set in italics under the employer. Leave blank to omit."
            location: &location
              type: plaintext
              inline: true
              default: ""
              description: "Set in italics at the right of the second line. 'Pittsburgh, PA', 'Remote'. Leave blank to omit; with the line's other half blank too, the second line is not printed."
            details: &details
              type: richtext
              default: ""
              description: "Set under the entry. Usually a bulleted list, one line each and strongest first; a sentence, *italics* and **bold** set as well, and a heading sets as a bold line. Leave blank for nothing under the entry."
        description: "One row per job. A row is kept to one page, unless it is taller than a page."

  education:
    title: Education
    description: "Schools, most recent first: school and date on the first line, degree and location on the second. Prose written under the card prints under the heading, ahead of the schools."
    seed:
      schools:
        - school: School
          dates: Month YYYY
          degree: Degree
          location: City, ST
    fields:
      title:
        type: plaintext
        inline: true
        default: Education
        description: *title_description
      schools:
        type: array
        items:
          type: object
          properties:
            school:
              type: plaintext
              inline: true
              description: "Set in bold at the left of the first line."
            dates: *dates
            degree:
              type: plaintext
              inline: true
              default: ""
              description: "Degree and field, set in italics under the school. Leave blank to omit."
            location: *location
            details:
              <<: *details
              description: "Honors, activities, coursework, set under the entry. Most degrees need none."
        description: "One row per school or degree."

  skills:
    title: Skills
    description: "Skills in labelled groups, filled across the columns and then down. Prose written under the card prints under the heading, ahead of the groups."
    seed:
      skills:
        - label: Category
          items: Skill, Skill, Skill
    fields:
      title:
        type: plaintext
        inline: true
        default: Skills
        description: *title_description
      skills:
        type: array
        ui:
          layout: table
        items:
          type: object
          properties:
            label:
              type: plaintext
              inline: true
              description: "Set in bold, with its items on the line under it. Leave blank to print the items alone."
            items:
              type: plaintext
              inline: true
              description: "Usually comma separated. Printed as written — markup is the one thing a labeled row does not carry."
        description: "One label and its items per row."
      columns: &columns
        type: integer
        default: 2
        ui:
          compact: true
        description: "Number of columns. Two suits items that run most of a line; three suits single words."

  projects:
    title: Projects
    description: "Projects: name and link on the first line, details under them. Prose written under the card prints under the heading, ahead of the projects."
    seed:
      projects:
        - name: Project
          link: github.com/you/project
          details: |
            - What it does, and your part in it.
    fields:
      title:
        type: plaintext
        inline: true
        default: Projects
        description: *title_description
      projects:
        type: array
        items:
          type: object
          properties:
            name:
              type: plaintext
              inline: true
              description: "Set in bold at the left."
            link:
              type: string
              default: ""
              description: "Where to see it, set small and italic at the right as written: github.com/you/project reads better than its https:// form. A web address, an email address or a phone number becomes a live link; anything else, such as 'closed source', prints as written. Leave blank to omit."
            details: *details
        description: "One row per project."

  certifications:
    title: Certifications
    description: "A list filled across the columns and then down. Retitled, it holds any short items: awards, languages, clearances. Prose written under the card prints under the heading, ahead of the list."
    seed:
      items:
        - Certification (ABBREVIATION)
    fields:
      title:
        type: plaintext
        inline: true
        default: Certifications
        description: *title_description
      items:
        type: array
        items:
          type: richtext
          inline: true
        description: "One item per line. Keep each to a line at the column width. Italicize with *asterisks*."
      columns: *columns

  other:
    title: Other section
    description: "A section the kinds above do not name — volunteer work, military service, publications, a competition. Rows take the Experience shape with neutral names. Prose written under the card prints under the heading, ahead of the rows."
    seed:
      title: Section Title
      entries:
        - heading: Entry
          details: |
            - What it was, and what came of it.
    fields:
      title:
        type: plaintext
        inline: true
        description: "Printed in uppercase over a rule. This section has no usual heading, so this one is yours to write."
      entries:
        type: array
        items:
          type: object
          properties:
            heading:
              type: plaintext
              inline: true
              description: "Set in bold at the left of the first line."
            dates: *dates
            subtitle:
              type: plaintext
              inline: true
              default: ""
              description: "Set in italics under the heading. Leave blank to omit."
            location: *location
            details: *details
        description: "One row per item. A section that is only prose is a Summary with a title of its own."
