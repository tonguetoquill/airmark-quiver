quill:
  name: classic_resume
  version: 0.1.0
  backend: typst
  description: Classic single-page resume

typst:
  plate_file: plate.typ

# A resume is a stack of sections, and each kind of section is a card kind: a
# heading, optional prose under it, and the rows that section holds. The rows
# are the section's own, so an entry cannot land under the wrong heading.
main:
  description: "Your name and contact details go at the top. Add a card for each section, in the order you want them."
  ui:
    groups: [identity, page]
  # Everything prints under a section heading, so main carries no body: a
  # summary is a Summary card.
  body:
    enabled: false
  fields:
    name:
      type: string
      ui:
        group: identity
      description: "Your name as you want it read. It also names the PDF."

    contacts:
      type: array
      items:
        type: string
      ui:
        group: identity
      description: "How to reach you, one per line, most preferred first: email, phone, a profile such as linkedin.com/in/you, your city. Email addresses, web addresses, and phone numbers become links."

    paper:
      type: enum
      values:
        - us-letter
        - a4
      default: us-letter
      ui:
        group: page
        compact: true
      description: "Page size."

    font_size:
      type: number
      default: 12
      ui:
        group: page
        compact: true
      description: "Body text size in points. To fit one page, try a half point smaller before cutting content."

    margin:
      type: number
      default: 0.5
      ui:
        group: page
        compact: true
      description: "Margin in inches on all sides. Below about 0.4, printers may clip the edges."


# Each kind opens with the heading it prints. Its `default:` is the usual one,
# so a new card shows the heading it will print, and an authored "" prints
# none.
card_kinds:
  summary:
    title: Summary
    description: "A few lines on who you are and the work you want next. Rename it for any section that's just text, such as an objective."
    seed:
      $body: An engineer. Likes climbing rocks and making useful things.
    fields:
      title:
        type: plaintext
        inline: true
        default: Summary
        description: "The section heading. Leave blank to omit it; a summary at the top then sits right under your name."

  experience:
    title: Experience
    description: "Your jobs, most recent first."
    seed:
      jobs:
        - company: Employer
          dates: Month YYYY – Present
          role: Job Title
          location: City, ST
          details: |
            - What you did, and what it changed.
    fields:
      title:
        type: plaintext
        inline: true
        default: Work Experience
        description: &title_description "The section heading. Leave blank to omit it."
      jobs:
        type: array
        items:
          type: object
          properties:
            company:
              type: plaintext
              inline: true
              description: "The employer's name."
            dates: &dates
              type: plaintext
              inline: true
              default: ""
              description: "Written as you want it to read, for example 'August 2024 – Present'. Use the same style throughout."
            role:
              type: plaintext
              inline: true
              default: ""
              description: "Your job title."
            location: &location
              type: plaintext
              inline: true
              default: ""
              description: "Where it was, for example 'Pittsburgh, PA' or 'Remote'."
            details: &details
              type: richtext
              default: ""
              description: "What you did, usually as short bullets with the strongest first."
        description: "One entry per job."

  education:
    title: Education
    description: "Your schools, most recent first."
    seed:
      schools:
        - school: School
          dates: Month YYYY
          degree: Degree
          location: City, ST
    fields:
      title:
        type: plaintext
        inline: true
        default: Education
        description: *title_description
      schools:
        type: array
        items:
          type: object
          properties:
            school:
              type: plaintext
              inline: true
              description: "The school's name."
            dates: *dates
            degree:
              type: plaintext
              inline: true
              default: ""
              description: "Degree and field of study."
            location: *location
            details:
              <<: *details
              description: "Honors, activities, or coursework. Most entries need none."
        description: "One entry per school or degree."

  skills:
    title: Skills
    description: "Your skills, in labeled groups."
    seed:
      skills:
        - label: Category
          items: Skill, Skill, Skill
    fields:
      title:
        type: plaintext
        inline: true
        default: Skills
        description: *title_description
      skills:
        type: array
        ui:
          layout: table
        items:
          type: object
          properties:
            label:
              type: plaintext
              inline: true
              description: "The group's name, for example 'Languages'. Leave blank to list the skills alone."
            items:
              type: plaintext
              inline: true
              description: "The skills in this group, separated by commas."
        description: "One group per row."
      columns: &columns
        type: integer
        default: 2
        ui:
          compact: true
        description: "Number of columns. Two suit longer items; three suit single words."

  projects:
    title: Projects
    description: "Your projects, each with an optional link."
    seed:
      projects:
        - name: Project
          link: github.com/you/project
          details: |
            - What it does, and your part in it.
    fields:
      title:
        type: plaintext
        inline: true
        default: Projects
        description: *title_description
      projects:
        type: array
        items:
          type: object
          properties:
            name:
              type: plaintext
              inline: true
              description: "The project's name."
            link:
              type: string
              default: ""
              description: "Where to see it, for example github.com/you/project. It prints as written, so leave off https://."
            details: *details
        description: "One entry per project."

  certifications:
    title: Certifications
    description: "A short list in columns. Rename it for awards, languages, clearances, or similar."
    seed:
      items:
        - Certification (ABBREVIATION)
    fields:
      title:
        type: plaintext
        inline: true
        default: Certifications
        description: *title_description
      items:
        type: array
        items:
          type: richtext
          inline: true
        description: "One per line, short enough to fit its column."
      columns: *columns

  other:
    title: Other section
    description: "Any other section, such as volunteer work, military service, or publications."
    seed:
      title: Section Title
      entries:
        - heading: Entry
          details: |
            - What it was, and what came of it.
    fields:
      title:
        type: plaintext
        inline: true
        description: "The section heading."
      entries:
        type: array
        items:
          type: object
          properties:
            heading:
              type: plaintext
              inline: true
              description: "The entry's name, such as an organization or publication."
            dates: *dates
            subtitle:
              type: plaintext
              inline: true
              default: ""
              description: "A second line, such as your role."
            location: *location
            details: *details
        description: "One entry per item."
