quill:
  name: afto244
  version: 0.0.1
  backend: acroform
  requires: ">=0.133"
  description: "AFTO Form 244 — Industrial/Support Equipment Record (TO 00-20-1)"

main:
  body:
    enabled: false
  fields:
    item_identification:
      type: object
      title: "I. ITEM IDENTIFICATION"
      properties:
        nomenclature:
          type: text
          title: "1. NOMENCLATURE/MODEL"
          default: ""
          multiline: true
          example: "Hydraulic Test Stand"
          description: "The equipment's name or model."
        registration_serial_no:
          type: text
          title: "2. REGISTRATION/SERIAL NO."
          default: ""
          multiline: true
          example: "HTS-2048"
          description: "Its registration or serial number."
        id_no:
          type: text
          title: "3. ID NO."
          default: ""
          example: "A-17"
          ui:
            compact: true
          description: "Its identification number."
        field_no:
          type: text
          title: "4. FIELD NO. (If applicable)"
          default: ""
          example: "2"
          ui:
            compact: true
          description: "Its field number. Leave blank when the equipment has none."
        work_unit_code:
          type: text
          title: "5. WORK UNIT CODE"
          default: ""
          example: "04"
          ui:
            compact: true
          description: "The work unit code for this equipment."
        orgn_wc_assigned:
          type: text
          title: "6. ORGN WC ASSIGNED"
          default: ""
          multiline: true
          example: "523 MXS"
          description: "The organization and work center this equipment is assigned to."
        period_cover:
          type: object
          title: "7. PERIOD COVER"
          description: "Two dates, the first through the last. The form prints TO between the boxes."
          properties:
            from:
              type: date
              title: "From"
              default: ""
              example: 2026-01-15
              ui:
                compact: true
              description: "The first day of the period this record covers."
            to:
              type: date
              title: "To"
              default: ""
              example: 2026-04-21
              ui:
                compact: true
              description: "The last day of that period."
        block_8:
          type: text
          title: "Block 8"
          default: ""
          multiline: true
          description: "The form prints only the block number."
    non_scheduled_inspection:
      type: object
      title: "II. NON-SCHEDULED INSPECTION"
      properties:
        row_1:
          type: object
          title: "Row 1"
          properties:
            time_1:
              type: text
              title: "TIME"
              default: ""
              multiline: true
              example: "0830"
              ui:
                compact: true
              description: "Column 1. Hours and minutes as four digits, such as 0830. Leave blank when that inspection has no time."
            insp_init_1:
              type: text
              title: "INSP INIT"
              default: ""
              multiline: true
              example: "K.L."
              ui:
                compact: true
              description: "Column 1. The inspector's initials."
            time_2:
              type: text
              title: "TIME"
              default: ""
              multiline: true
              example: "1415"
              ui:
                compact: true
              description: "Column 2. Hours and minutes as four digits, such as 0830. Leave blank when that inspection has no time."
            insp_init_2:
