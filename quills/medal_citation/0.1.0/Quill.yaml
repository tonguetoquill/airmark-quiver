quill:
  name: medal_citation
  version: 0.1.0
  backend: typst
  description: "Air and Space Achievement, Meritorious Service, and Air and Space Commendation Medal citations"

typst:
  plate_file: plate.typ

main:
  description: "The certificate. Medal picks which. The accomplishments paragraph is 1350 characters, including spaces."
  body:
    enabled: false
  fields:
    medal:
      type: enum
      default: Air and Space Achievement Medal
      values:
        - Air and Space Achievement Medal
        - Meritorious Service Medal
        - Air and Space Commendation Medal
      description: "Which citation. The Meritorious Service Medal takes the approving official's name and grade as two fields."
      variants:
        Air and Space Achievement Medal:
          afam_signed_on:
            type: date
            default: "2026-10-13"
            title: Signed on
            description: "The date the certificate is given. It prints as 13 OCTOBER 2026."
          commander_name: &named-with-grade
            type: text
            default: "NAME, Rank, USAF"
            title: Commander name
            description: "The approving official's name, then grade after a comma, for example ANDREW P. GRIFFITH, Colonel, USAF. The grade prints on its own line under the name."
        Meritorious Service Medal:
          signed_on: &shown-date
            type: date
            default: "2026-10-12"
            title: Signed on
            description: "The date the certificate is given. It prints as 12 OCTOBER 2026."
          msm_commander_name:
            type: text
            default: NAME
            title: Commander name
            description: "The approving official's name, for example ANDREW P. GRIFFITH."
          commander_grade:
            type: text
            default: "Rank, USAF"
            title: Commander grade
            description: "The approving official's grade, for example Major General, USAF."
        Air and Space Commendation Medal:
          signed_on: *shown-date
          commander_name: *named-with-grade

    oak_leaf_cluster:
      type: enum
      default: Basic
      values:
        - Basic
        - First Oak Leaf Cluster
        - Second Oak Leaf Cluster
        - Third Oak Leaf Cluster
        - Fourth Oak Leaf Cluster
        - Fifth Oak Leaf Cluster
        - Sixth Oak Leaf Cluster
        - Seventh Oak Leaf Cluster
        - Eighth Oak Leaf Cluster
        - Ninth Oak Leaf Cluster
        - Tenth Oak Leaf Cluster
      description: "Basic prints no cluster. A later award prints the cluster, in capitals, under the medal name."

    rank:
      type: text
      default: ""
      description: "The recipient's grade and name, for example Staff Sergeant Jane A. Doe. It prints in capitals under the award line."

    service:
      type: text
      default: ""
      description: "What the medal recognizes, such as meritorious service."

    period_from:
      type: date
      default: ""
      description: "The first day of the period. It prints as 11 OCTOBER 2024."

    period_to:
      type: date
      default: ""
      description: "The last day of the period. It prints as 12 OCTOBER 2026."

    accomplishments:
      type: richtext
      multiline: false
      max: 1350
      default: ""
      description: "The citation paragraph. 1350 characters, including spaces."

    commander_title:
      type: text
      default: ""
      description: "The approving official's duty title."

    special_order:
      type: text
      default: ""
      description: "The special order number, for example G-12214. It prints at the foot of the certificate; blank prints nothing."

    condition:
      type: text
      default: ""
      description: "The decoration's condition code, for example 4. It prints at the foot of the certificate; blank prints nothing."

    pas:
      type: text
      default: ""
      description: "The recipient's personnel accounting symbol, for example DM1LFHS2. It prints at the foot of the certificate; blank prints nothing."

    rdp:
      type: date
      default: ""
      description: "The date of the Recommendation for Decoration Printout. It prints at the foot of the certificate as 19 AUG 2025; blank prints nothing."
