quill:
  name: daf4392
  version: 0.1.0
  backend: typst
  description: "DAF Form 4392 - Pre-Departure Safety Briefing (Page 2)"

typst:
  plate_file: plate.typ

main:
  body:
    enabled: false
  fields:
    transportation_mode:
      type: enum
      values: [ pmv, airplane, bus, train, motorcycle, other ]
      default: pmv
      example: airplane
      description: "How you're traveling."

    departure_date:
      type: date
      default: ""
      example: 2026-06-01
      ui:
        compact: true
      description: "The day you leave."

    final_destination:
      type: text
      default: ""
      example: San Antonio, TX
      ui:
        compact: true
      description: "Where you're going, for example Denver, CO."

    dept_flight_num:
      type: text
      default: ""
      example: AA 1482
      ui:
        compact: true
      description: "Your departure flight number, if you're flying. A tentative number is fine."

    arrival_flight_num:
      type: text
      default: ""
      example: AA 2217
      ui:
        compact: true
      description: "Your arrival flight number, if you're flying. A tentative number is fine."

    notes:
      type: text
      multiline: true
      default: ""
      example: Visiting family over leave; rental car for local travel.
      description: "Anything else about your trip."

    organization:
      type: text
      default: ""
      example: 1st Air Control Squadron
      ui:
        compact: true
      description: "Your unit."

    briefed_date:
      type: date
      default: ""
      example: 2026-05-22
      ui:
        compact: true
      description: "The date of the briefing."

    briefee_name:
      type: text
      default: ""
      example: Doe, John
      ui:
        compact: true
      description: "Your name as Last, First."

    briefee_grade:
      type: text
      default: ""
      example: E-5
      ui:
        compact: true
      description: "Your grade."

    briefer_name:
      type: text
      default: ""
      example: Smith, Jane
      ui:
        compact: true
      description: "The briefer's name as Last, First."

    briefer_grade:
      type: text
      default: ""
      example: E-7
      ui:
        compact: true
      description: "The briefer's grade."

    emergency_contact_name:
      type: text
      default: ""
      example: Doe, Mary
      description: "Who to contact in an emergency."

    emergency_contact_phone:
      type: text
      default: ""
      example: (555) 555-0142
      description: "Your emergency contact's phone number."

card_kinds:
  itinerary:
    title: Proposed Travel Itinerary
    description: "One leg of your trip. The form holds up to 10."
    body:
      enabled: false
    ui:
      groups:
        itinerary_entry: {}
    fields:
      date:
        type: date
        default: ""
        example: 2026-06-01
        ui:
          group: itinerary_entry
          compact: true
        description: "The date of this leg."
      departure_point:
        type: text
        default: ""
        example: Panama City, FL
        ui:
          group: itinerary_entry
          compact: true
        description: "Where this leg starts."
      arrival_point:
        type: text
        default: ""
        example: San Antonio, TX
        ui:
          group: itinerary_entry
          compact: true
        description: "Where this leg ends."
      rest_length:
        type: text
        default: ""
        example: 3 days
        ui:
          group: itinerary_entry
          compact: true
        description: "How long you'll stay."
      mileage:
        type: text
        default: ""
        ui:
          group: itinerary_entry
          compact: true
        description: "Approximate miles for this leg. Leave blank for flights."
