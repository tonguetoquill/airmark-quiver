quill:
  name: daf4392
  version: 0.1.0
  backend: typst
  description: "DAF Form 4392 - Pre-Departure Safety Briefing (Page 2)"

typst:
  plate_file: plate.typ

main:
  body:
    enabled: false
  fields:
    transportation_mode:
      type: enum
      values: [pmv, airplane, bus, train, motorcycle, other]
      default: pmv
      description: "How you're traveling."

    departure_date:
      type: date
      default: ""
      ui:
        compact: true
      description: "The day you leave."

    final_destination:
      type: string
      default: ""
      ui:
        compact: true
      description: "Where you're going, for example Denver, CO."

    dept_flight_num:
      type: string
      default: ""
      ui:
        compact: true
      description: "Your departure flight number, if you're flying. A tentative number is fine."

    arrival_flight_num:
      type: string
      default: ""
      ui:
        compact: true
      description: "Your arrival flight number, if you're flying. A tentative number is fine."

    notes:
      type: string
      default: ""
      description: "Anything else about your trip."

    organization:
      type: string
      default: ""
      ui:
        compact: true
      description: "Your unit."

    briefed_date:
      type: date
      default: ""
      ui:
        compact: true
      description: "The date of the briefing."

    briefee_name:
      type: string
      default: ""
      ui:
        compact: true
      description: "Your name as Last, First."

    briefee_grade:
      type: string
      default: ""
      ui:
        compact: true
      description: "Your grade."

    briefer_name:
      type: string
      default: ""
      ui:
        compact: true
      description: "The briefer's name as Last, First."

    briefer_grade:
      type: string
      default: ""
      ui:
        compact: true
      description: "The briefer's grade."

    emergency_contact_name:
      type: string
      default: ""
      description: "Who to contact in an emergency."

    emergency_contact_phone:
      type: string
      default: ""
      description: "Your emergency contact's phone number."

card_kinds:
  itinerary:
    title: Proposed Travel Itinerary
    description: "One leg of your trip. The form holds up to 10."
    ui:
      groups: [itinerary_entry]
    body:
      enabled: false
    fields:
      date:
        type: date
        default: ""
        ui:
          group: itinerary_entry
          compact: true
        description: "The date of this leg."
      departure_point:
        type: string
        default: ""
        ui:
          group: itinerary_entry
          compact: true
        description: "Where this leg starts."
      arrival_point:
        type: string
        default: ""
        ui:
          group: itinerary_entry
          compact: true
        description: "Where this leg ends."
      rest_length:
        type: string
        default: ""
        ui:
          group: itinerary_entry
          compact: true
        description: "How long you'll stay."
      mileage:
        type: string
        default: ""
        ui:
          group: itinerary_entry
          compact: true
        description: "Approximate miles for this leg. Leave blank for flights."
