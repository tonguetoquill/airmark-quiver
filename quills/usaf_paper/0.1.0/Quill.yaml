quill:
  name: usaf_paper
  version: 0.1.0
  backend: typst
  description: U.S. Air Force Paper

typst:
  plate_file: plate.typ

main:
  description: "Paper picks the page. On a talking paper, open with the point, then short phrases. A line of its own, such as PURPOSE, is a heading, and each bullet level adds a dash. A bullet background paper opens with the point, then the same dashes. A background paper opens with the purpose and closes with the conclusion. A position paper states the position in the first paragraph and restates it, with the action you want, in the last. On those two, paragraphs are numbered, a bullet becomes a lettered subparagraph, and a single paragraph is not numbered. On a formal trip report, each label leads its paragraph, followed by a colon: purpose, travelers, itinerary, discussion, and conclusions or recommendations."
  body:
    enabled: false
  sections:
    document:
      fields:
        paper:
          type: enum
          values:
            - Talking Paper
            - Bullet Background Paper
            - Background Paper
            - Position Paper
            - Formal Trip Report
          default: Talking Paper
          description: "Which paper. The talking paper and the bullet background paper print dashes. The background paper and the position paper number paragraphs. The formal trip report is the official memorandum."
          variants:
            Talking Paper:
              <<: &point-paper
                subject:
                  type: plaintext
                  inline: true
                  default: Subject of the Paper
                  description: "The subject, in title case. It prints in capitals under ON, and a long subject wraps, centered, on the next line."
                originator:
                  type: plaintext
                  inline: true
                  default: ""
                  description: "Your rank and name, for example 'MSgt Alex R. Rivera'. It leads the identification line."
                organization:
                  type: plaintext
                  inline: true
                  default: ""
                  ui:
                    compact: true
                  description: "Your organization, for example '123 ES'."
                office_symbol:
                  type: plaintext
                  inline: true
                  default: ""
                  ui:
                    compact: true
                  description: "Your office symbol, for example '123 ES/DO'."
                phone:
                  type: plaintext
                  inline: true
                  default: ""
                  ui:
                    compact: true
                  description: "Your phone number, for example 'DSN 555-0142'."
                typist:
                  type: plaintext
                  inline: true
                  default: ""
                  ui:
                    compact: true
                  description: "The typist's initials. Leave blank to leave them off the line."
              talking:
                type: richtext
                title: Body
                description: "Open with the point, then short phrases. A line of its own, such as PURPOSE, reads as a heading, and each bullet level adds a dash."
                default: |
                  State the point in one or two sentences.

                  PURPOSE

                  - The point the listener should leave with
                  - A second point, in a short phrase

                  DISCUSSION

                  - The fact that supports the point
                    - A detail under that fact

                  RECOMMENDATION

                  - The action you want, stated so it can be approved as written
            Bullet Background Paper:
              <<: *point-paper
              bullet_background:
                type: richtext
                title: Body
                description: "Open with the point. A line of its own, such as PURPOSE, reads as a heading. Each bullet level adds a dash, and a bullet may run longer than one line."
                default: |
                  State the point of the paper in a sentence or a short paragraph. Say what the reader should take from it.

                  PURPOSE

                  Say what you want decided or understood. One sentence is enough when the point is narrow.

                  BACKGROUND

                  - One fact the reader needs, written as its own bullet
                  - A second fact
                    - A detail that belongs under the fact above it
                      - A further detail, indented one more level

                  DISCUSSION

                  - The main point, which may run past one line when the reader needs the reason and not only the claim
                    - What supports it
                    - What it costs, changes, or puts at risk

                  RECOMMENDATION

                  - The action you want, stated so the reader can approve it as written
                    - Who does it, and by when
            Background Paper:
              <<: *point-paper
              background:
                type: richtext
                title: Body
                description: "Write full sentences. Paragraphs are numbered, and a bullet becomes a lettered subparagraph. Open with the purpose and close with the conclusion."
                default: |
                  State the purpose of the paper and the outline of what follows. This paragraph is numbered when the paper has more than one.

                  Give the background the reader needs, in the order that makes the conclusion follow. One paragraph, one idea.

                  - A fact that belongs under the paragraph above
                  - A second fact

                  Close with the conclusion. Say what the background adds up to, and what decision or action it sits in front of.
            Position Paper:
              <<: *point-paper
              position:
                type: richtext
                title: Body
                description: "The first paragraph states the position. The last restates it and names the action you want. Paragraphs are numbered, and a bullet becomes a lettered subparagraph."
                default: |
                  State the position and the action you want, in one paragraph.

                  Give the background that supports the position, and answer the argument against it.

                  - The evidence that ties the background to the position
                  - The cost, change, or risk the reader should weigh

                  Restate the position and the specific action you want. The reader should be able to approve the last paragraph as written.
            Formal Trip Report:
              trip_subject:
                type: plaintext
                inline: true
                title: Subject
                default: "Trip Report, Destination, 4-6 November 2026"
                description: "The memorandum subject, in title case. Put any suspense date in parentheses at the end."
              letterhead_title:
                type: array
                items:
                  type: plaintext
                  inline: true
                default:
                  - DEPARTMENT OF THE AIR FORCE
                  - YOUR SQUADRON HERE
                description: "The letterhead, in uppercase. Keep the first line unless you work for a joint command or a DoW agency, and add your unit's full name on the lines below it."
              letterhead_seal:
                type: enum
                values:
                  - dow
                  - dod
                default: dow
                ui:
                  compact: true
                description: "The seal at the top left of the letterhead: Department of War or Department of Defense."
              letterhead_seal_subtitle:
                type: plaintext
                inline: true
                default: ""
                ui:
                  compact: true
                description: "An optional line in bold capitals under the seal."
              tag_line:
                type: richtext
                inline: true
                default: ""
                ui:
                  compact: true
                description: "Your unit's motto, centered at the bottom of every page."
              memo_for:
                type: array
                items:
                  type: plaintext
                  inline: true
                default:
                  - ORG/SYM
                ui:
                  compact: true
                description: "Each recipient's office symbol, one per line. To address a person, add their rank and name in parentheses, for example 'ORG/SYMBOL (LT COL JANE DOE)'. For a long list, enter 'SEE DISTRIBUTION' and list everyone under Distribution."
              memo_from:
                type: array
                items:
                  type: plaintext
                  inline: true
                default:
                  - ORG/SYMBOL
                ui:
                  compact: true
                description: "Your office symbol. If any recipient is off your installation, add your full mailing address below it. Leave blank for a memorandum for record."
              authority_line:
                type: plaintext
                inline: true
                default: ""
                ui:
                  compact: true
                description: "Usually blank. When you sign on the commander's behalf or state the headquarters' position, enter 'FOR THE COMMANDER'. It prints above the signature block."
              signature_block:
                type: array
                items:
                  type: plaintext
                  inline: true
                default:
                  - FIRST M. LAST, Rank, USAF
                  - Duty Title
                ui:
                  compact: true
                description: "Your name in uppercase, grade, and service on the first line, for example 'FIRST M. LAST, Capt, USAF'. Your duty title on the second."
              references:
                type: array
                items:
                  type: richtext
                  inline: true
                default: []
                description: "Cite each by organization, type, date, and title. One reference prints after the subject; two or more print as a lettered list."
              cc:
                type: array
                items:
                  type: plaintext
                  inline: true
                default: []
                description: Offices or people receiving a courtesy copy, one per line.
              distribution:
                type: array
                items:
                  type: plaintext
                  inline: true
                default: []
                description: "Everyone the memo goes to, when Memo For says 'SEE DISTRIBUTION'."
              attachments:
                type: array
                items:
                  type: richtext
                  inline: true
                default:
                  - Meeting minutes, 6 November 2026
                description: "Attachments in the order the memo mentions them. Describe each briefly and include its date. Don't write 'as stated'."
              memo_style:
                type: enum
                values:
                  - usaf
                  - daf
                default: usaf
                ui:
                  compact: true
                description: "USAF for most memos, DAF for headquarters memos. DAF style dates as 'September 15, 2026' and indents paragraphs instead of numbering them."
              trip:
                type: richtext
                title: Body
                description: "Each label leads its paragraph, followed by a colon."
                default: |
                  PURPOSE: State why you went. Name the trip in a sentence.

                  TRAVELER(S): Rank, first name or initial, and surname. Add the position title when the travelers come from different offices.

                  ITINERARY: Where you went, the inclusive dates, and the people you met.

                  DISCUSSION: The objective, what got in the way, what you found, what it cost, and any commitment the unit made. Match the detail to the reader.

                  CONCLUSIONS/RECOMMENDATIONS: The findings, and the action you recommend.

                  - One recommended action

        date:
          type: date
          default: ""
          ui:
            compact: true
          description: "The date you prepare a point paper, or the date you sign a trip report. A point paper prints it as 12 Oct 26. A trip report prints it as 12 October 2026, or as September 15, 2026 in DAF style. Leave blank to add a fillable date on the PDF."
    classification:
      fields:
        classification:
          type: enum
          values:
            - UNCLASSIFIED
            - CUI
            - CONFIDENTIAL
            - SECRET
            - TOP SECRET
          default: ""
          ui:
            compact: true
          description: "The classification banner at the top and bottom of every page. Leave blank for an unclassified document."
          variants:
            CUI:
              controlled_by:
                type: plaintext
                inline: true
                description: "The office that designated this information as CUI, for example 'SAF/AA'."
              poc:
                type: plaintext
                inline: true
                description: "Who to contact with questions about this CUI, with phone and email, for example 'Capt J. Smith, DSN 555-1234, john.smith@us.af.mil'."
              category:
                type: plaintext
                inline: true
                default: ""
                description: "The category from the DoD CUI Registry, for example 'CTI' or 'PRVCY'."
              limited_dissemination:
                type: plaintext
                inline: true
                default: ""
                description: "A dissemination control for the CUI block, for example 'FEDONLY' or 'NOFORN'. To add one to the banner, use Dissemination."
        dissemination:
          type: plaintext
          inline: true
          default: ""
          ui:
            compact: true
          description: "A control added to the end of the banner. For example, 'NF' prints as CUI//NF."
    additional:
      fields:
        font_size:
          type: number
          default: 12
          ui:
            compact: true
          description: "Body text size in points. The standard is 12."
