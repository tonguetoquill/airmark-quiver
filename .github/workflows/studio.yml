# Deploy the quiver's studio to Pages on every push to main. `quillkit build`
# writes the arrangement a deploy serves — the client at a root, a built quiver
# at `quiver/` beneath it — and asserts both halves, so the build is one command
# and the deploy stays here: nothing outside this repository holds `pages: write`.
name: studio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Pages takes one deploy at a time, and a superseded run waits rather than being
# cancelled: cancelling mid-deploy leaves the site on whichever generation landed
# last, which is not necessarily the newest commit's.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install
        run: npm ci

      # `quillkit build` packs files and opens none of them — it stats each
      # `Quill.yaml` as a sentinel and never parses it — so a quill that does not
      # compile packs cleanly and reports itself in the client. That is what the
      # author's loop wants and what a deploy does not, and nothing makes this
      # workflow wait on `ci.yml`. So the gate runs here, ahead of the pack.
      - name: Test
        run: npm test

      - name: Build the studio site
        run: npm run build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
