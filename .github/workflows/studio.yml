# Deploy the quiver's studio to Pages on every push to main. The build half is
# quillmark-js's reusable workflow — it packs this collection, lays the client
# over it, and asserts the layout — so the deploy stays here and nothing outside
# this repository holds `pages: write`.
name: studio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Pages takes one deploy at a time, and a superseded run waits rather than being
# cancelled: cancelling mid-deploy leaves the site on whichever generation landed
# last, which is not necessarily the newest commit's.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # `quiver build` packs files and opens none of them — it stats each `Quill.yaml`
  # as a sentinel and never parses it — so a quill that does not compile packs
  # cleanly and reports itself in the client. That is what the author's loop wants
  # and what a deploy does not, and nothing makes this workflow wait on `ci.yml`.
  # So the gate runs here, and the deploy is downstream of it.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  build:
    needs: gate
    uses: borb-sh/quillmark-js/.github/workflows/studio-pages.yml@main

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
