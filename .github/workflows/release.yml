name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.next }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Read package version
        id: version
        run: |
          NEXT=$(node -p "require('./package.json').version")
          if [[ ! "$NEXT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "package.json version '$NEXT' is not x.y.z or x.y.z-rc.n" >&2
            exit 1
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Releasing v${NEXT}"

      - name: Tag and push
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          awk -v v="## v${VERSION}" \
            '$0 ~ "^"v {f=1; next} /^## / && f {exit} f {print}' \
            CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "Release v${VERSION}" > notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file notes.md \
              --prerelease
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file notes.md \
              --latest
          fi

  publish-npm:
    needs: [prepare]
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.prepare.outputs.version }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Upgrade npm for Trusted Publishers
        run: npm install -g npm@12.2.3

      - name: Publish @airmark/quiver (trusted publisher, with provenance)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance
          fi
