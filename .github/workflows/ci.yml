name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build the studio site
        run: npm run site

      # A fork PR cannot deploy to Pages, so the site it would have been served
      # at rides out as an artifact: unzip it, serve the directory, same client.
      - name: Upload the studio site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-site
          path: site/
