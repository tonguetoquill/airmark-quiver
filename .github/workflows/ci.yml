name: ci

# Pull requests only. A push to main runs the same `npm test` inside `studio.yml`
# ahead of the pack, so main keeps its gate without building the site twice.
on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build the studio site
        run: npm run build

      # A fork PR cannot deploy to Pages, so the site it would have been served
      # at rides out as an artifact: unzip it, serve the directory, same client.
      - name: Upload the studio site
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-site
          path: dist/
