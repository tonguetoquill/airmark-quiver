name: ci

# Pull requests only. A push to main runs the same `npm test` inside `studio.yml`
# ahead of the pack, so main keeps its gate without building the site twice.
on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build the studio site
        run: npm run build

      # A fork PR cannot deploy to Pages, so the site it would have been served
      # at rides out as an artifact: unzip it, serve the directory, same client.
      - name: Upload the studio site
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-site
          path: dist/
